  <text x="800" y="860" text-anchor="middle" font-size="12" fill="#718096">Sumber: D03_Module_Optimization_Fase1.md · D03_Electrical_System_Design.md v1.5 · pcb_nets.py</text>
  <text x="800" y="885" text-anchor="middle" font-size="12" fill="#c53030">Ini schematic BLOK untuk teknisi — bukan Gerber. Regen seats sebelum fab.</text>

  <rect x="40" y="910" width="1520" height="230" fill="#fffbeb" stroke="#d69e2e" stroke-width="2" rx="8"/>
  <text x="70" y="950" font-size="15" font-weight="700">Pin seat U3 FIXED (3 pin)</text>
  <text x="70" y="980" font-size="13">1 = VIN (+24V) · 2 = GND · 3 = VOUT (+5V_SYS) · TIDAK ADA pad ADJ · VIN abs max ≥ 28 V</text>
  <text x="70" y="1015" font-size="15" font-weight="700">Pin seat MAX31856 (8 pin) ×3</text>
  <text x="70" y="1045" font-size="13">1 VIN · 2 3Vo(NC) · 3 GND · 4 DO(MISO) · 5 CS · 6 CLK · 7 DIN(MOSI) · 8 DRDY(NC)</text>
  <text x="70" y="1080" font-size="13" fill="#c53030" font-weight="700">CS: Bean GPIO5 · Env GPIO15 · Motor GPIO0 · U8=DNP · U11=PCF IN (jangan DNP)</text>
  <text x="70" y="1115" font-size="12" fill="#4a5568">Blueprint detail: D03_ENGINEERING_BLUEPRINT.svg · DevKit map: L2_MAIN_DEVKIT_PINMAP.svg</text>
