  <text x="60" y="115" font-size="16" font-weight="700" fill="#c05621">A. POWER (wajib dulu)</text>
  <text x="60" y="145" font-size="13">☐ J9.1  →  U3.1 VIN     net +24V_IN    (lebar ≥0.80 mm)</text>
  <text x="60" y="170" font-size="13">☐ J9.2  →  GND zone     net GND</text>
  <text x="60" y="195" font-size="13">☐ U3.2  →  GND          net GND</text>
  <text x="60" y="220" font-size="13">☐ U3.3  →  U1.L19       net +5V_SYS    (ke DevKit 5V) ≥0.80 mm</text>
  <text x="60" y="245" font-size="13">☐ U3.3  →  U7/U9/U10/U11/U12/U13 + C4  net +5V_SYS</text>
  <text x="60" y="270" font-size="13">☐ U2 ← +5V_SYS · U2 → U4.1 &amp; U5.1 &amp; U6.1  net +3V3_ANA ≥0.50 mm</text>
  <text x="60" y="300" font-size="12" fill="#c53030" font-weight="700">U3 = FIXED 5V 3 pin · VIN≥28V · NO ADJ · QC VOUT 4.90–5.10 V</text>

  <rect x="820" y="85" width="740" height="250" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2" rx="8"/>
