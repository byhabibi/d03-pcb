  <text x="60" y="420" font-size="13">☐ J_H1 BTN_AIR/DRUM/BURN → opto U14/U15/U16 → L9/L10/L11</text>
  <text x="60" y="445" font-size="13">☐ BTN_PUMP / BTN_COOL → opto U18/U17 → U11 P4 / P5 (bukan GPIO37/38)</text>
  <text x="60" y="470" font-size="13">☐ J_H1 pots → L3 POT_AIR · L4 POT_BURN · GAS_PRESS L5 · MQ6 L6</text>
  <text x="60" y="495" font-size="13">☐ PROX_RPM → U1.L12 (GPIO14)</text>
  <text x="60" y="520" font-size="13">☐ U11 P0 GX103 · P1 ESTOP · P2/P3 flame/burner FB</text>
  <text x="60" y="550" font-size="12">BTN_* Active LOW · pull-up dekat opto · jangan pakai GPIO37/38 DevKitC</text>

  <rect x="820" y="360" width="740" height="240" fill="#fff5f5" stroke="#c53030" stroke-width="2" rx="8"/>
  <text x="840" y="390" font-size="16" font-weight="700" fill="#c53030">D. OUTPUT KE IO (J9) — gas/VFD</text>
  <text x="840" y="420" font-size="13">☐ U10 P0 → J9.5   GAS_EN</text>
  <text x="840" y="445" font-size="13">☐ U10 P1 → J9.6   VFD_D_RUN</text>
  <text x="840" y="470" font-size="13">☐ U10 P2 → J9.7   VFD_F_RUN</text>
  <text x="840" y="495" font-size="13">☐ U10 P3 → J9.8   AGIT_EN · P4→J9.9 COOL · P5→J9.10 PUMP</text>
  <text x="840" y="520" font-size="13">☐ DAC → J9.11/12 · U1.L15 → SERVO_PWM (bukan via J9)</text>
  <text x="840" y="550" font-size="12" fill="#c53030">J9.1 = +24V ke MAIN U3 · jauhkan gas control dari SPI panjang</text>

  <rect x="40" y="625" width="740" height="240" fill="#faf5ff" stroke="#6b46c1" stroke-width="2" rx="8"/>
  <text x="60" y="655" font-size="16" font-weight="700" fill="#6b46c1">E. RS485 + I2C + AUDIO + UART</text>
  <text x="60" y="685" font-size="13">☐ U1.R11 → U7.7 UART1_TX · U1.R12 → U7.6 UART1_RX</text>
  <text x="60" y="710" font-size="13">☐ U7 → J4 RS485_A/B · TVS + bias dekat J4</text>
  <text x="60" y="735" font-size="13">☐ U1.R6 → SDA · U1.R3 → SCL → U10/U11/U12/U13</text>
  <text x="60" y="760" font-size="13">☐ U1.R13 → U9.2 DFPLAYER_TX · U9.1 ← +5V</text>
  <text x="60" y="785" font-size="13">☐ J_H1 ←→ UART2 Nextion (L7/L8)</text>
  <text x="60" y="815" font-size="12">I2C addr: U10@0x20 OUT · U11@0x21 IN · DAC MCP4725 @0x60/0x61</text>

  <rect x="820" y="625" width="740" height="240" fill="#edf2f7" stroke="#4a5568" stroke-width="2" rx="8"/>
  <text x="840" y="655" font-size="16" font-weight="700">F. FOOTPRINT SEATS (KiCad)</text>
  <text x="840" y="685" font-size="13">☐ U1 = D03:MODULE_ESP32_DEVKITC (bukan WROOM soldered)</text>
  <text x="840" y="710" font-size="13">☐ U3 = MODULE_MP1584 FIXED 5V 3P (VIN/GND/VOUT)</text>
  <text x="840" y="735" font-size="13">☐ U4 / U5 / U6 = MODULE_MAX31856_8P ×3</text>
  <text x="840" y="760" font-size="13">☐ U8 + J_USB = DNP Fase 1 (jangan populate)</text>
  <text x="840" y="785" font-size="13">☐ U11 TETAP diisi (PCF input) — DNP = U8 saja</text>
  <text x="840" y="815" font-size="12" fill="#744210">Silk: BUCK 5V FIXED · DevKit · BEAN/ENV/MOTOR TC · NO L1/L4 discrete</text>

  <rect x="40" y="890" width="1520" height="160" fill="#ffffff" stroke="#a0aec0" stroke-width="2" rx="8"/>
  <text x="60" y="925" font-size="15" font-weight="700">G. Urutan kerja junior di KiCad</text>
  <text x="60" y="955" font-size="13">1. Place seats (U3→U1→U4/U5/U6→J9→J_H1→chips) sesuai zona L2 placement</text>
  <text x="60" y="980" font-size="13">2. Assign net tiap pad dari checklist A–E · jangan menebak GPIO</text>
  <text x="60" y="1005" font-size="13">3. Route +24V → +5V → GND → SPI → TC → UART → I2C → GPIO → Silk (L3_13)</text>
  <text x="60" y="1030" font-size="13">4. DRC 0 · Gerber BARU · reject positions masih WROOM / MP1584EN / L4 / SOIC</text>

  <text x="800" y="1100" text-anchor="middle" font-size="12" fill="#718096">Truth: scripts/pcb_nets.py · config.h · D03_BOM_Production.csv · Electrical v1.5</text>
  <text x="800" y="1130" text-anchor="middle" font-size="13" font-weight="700" fill="#c53030">Gerber lama WROOM/SOIC — JANGAN kirim fab sampai langkah G.4 selesai</text>
