  <text x="840" y="145" font-size="13">☐ U1.R9  → U4.6 &amp; U5.6 &amp; U6.6   SPI_SCK</text>
  <text x="840" y="170" font-size="13">☐ U1.R2  → U4.7 &amp; U5.7 &amp; U6.7   SPI_MOSI</text>
  <text x="840" y="195" font-size="13">☐ U1.R8  → U4.4 &amp; U5.4 &amp; U6.4   SPI_MISO</text>
  <text x="840" y="220" font-size="13">☐ U1.R10 → U4.5  SPI_CS_BEAN (GPIO5)</text>
  <text x="840" y="245" font-size="13">☐ U1.R16 → U5.5  SPI_CS_ENV  (GPIO15)</text>
  <text x="840" y="270" font-size="13">☐ U1.R14 → U6.5  SPI_CS_MOTOR (GPIO0) + 10k pull-up ke +3V3</text>
  <text x="840" y="300" font-size="12" fill="#2b6cb0">J1/J2/J3 dekat U4/U5/U6 · SPI bus &lt; 40 mm · jauh buck U3</text>

  <rect x="40" y="360" width="740" height="240" fill="#f0fff4" stroke="#276749" stroke-width="2" rx="8"/>
