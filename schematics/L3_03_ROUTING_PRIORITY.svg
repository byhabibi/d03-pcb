  <text x="140" y="392" font-size="16" font-weight="700">SPI TC ×3</text>
  <text x="140" y="416" font-size="13" fill="#4a5568">DevKit kanan → U4/U5/U6 · pendek · lurus · 0 via ideal · jauh buck</text>
