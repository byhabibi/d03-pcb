<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 880" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1280" height="880" fill="#faf9f7"/>
  <text x="40" y="40" font-size="22" font-weight="700">L3 · ROUTING PRIORITY D03 (urutan wajib — jangan diacak)</text>
  <text x="40" y="68" font-size="13" fill="#c53030">+24V → +5V → GND → SPI → TC → UART → I2C → GPIO → Silk. Loncat = revisi mahal.</text>
  
  <circle cx="80" cy="124" r="24" fill="#2b6cb0"/>
  <text x="80" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">1</text>
  <rect x="120" y="100" width="1040" height="72" fill="#fff" stroke="#a0aec0" rx="6"/>
  <text x="140" y="128" font-size="16" font-weight="700">+24V_IN</text>
  <text x="140" y="152" font-size="13" fill="#4a5568">Lebar ≥0.80 mm · J9.1 → U3 VIN · dulu sebelum sinyal</text>
  <circle cx="80" cy="212" r="24" fill="#2b6cb0"/>
